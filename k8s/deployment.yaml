apiVersion: apps/v1
kind: Deployment

metadata:
  name: file-management-api
  labels:
    app: file-management-api

spec:
  replicas: 1

  selector:
    matchLabels:
      app: file-management-api

  template:
    metadata:
      labels:
        app: file-management-api

    spec:
      containers:

      - name: file-management-api

        image: 562590527524.dkr.ecr.us-east-1.amazonaws.com/devops-accelerator-file-management-api:v1

        ports:
        - containerPort: 8000

        resources:
          requests:
            cpu: "250m"
            memory: "256Mi"

          limits:
            cpu: "500m"
            memory: "512Mi"

        readinessProbe:
          httpGet:
            path: /health
            port: 8000

          initialDelaySeconds: 10
          periodSeconds: 10

        livenessProbe:
          httpGet:
            path: /health
            port: 8000

          initialDelaySeconds: 30
          periodSeconds: 20
